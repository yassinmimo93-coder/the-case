<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>THE CASE</title>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  min-height:100vh;
  font-family:Arial, sans-serif;
  background:
    radial-gradient(circle at 50% 10%,#292929 0%,#0b0b0b 55%,#030303 100%);
  color:white;
}

button,input{
  font:inherit;
}

button{
  cursor:pointer;
}

.screen{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
}

.card{
  width:100%;
  max-width:650px;
  background:rgba(20,20,20,.96);
  border:1px solid #444;
  border-radius:20px;
  padding:28px;
  box-shadow:0 20px 70px rgba(0,0,0,.6);
}

.logo{
  text-align:center;
  font-size:42px;
  font-weight:900;
  letter-spacing:6px;
  margin-bottom:8px;
}

.subtitle{
  text-align:center;
  color:#999;
  margin-bottom:30px;
}

input{
  width:100%;
  padding:15px;
  margin:8px 0;
  border-radius:12px;
  border:1px solid #444;
  background:#111;
  color:white;
  outline:none;
}

input:focus{
  border-color:#aaa;
}

.btn{
  width:100%;
  padding:15px;
  margin-top:12px;
  border:none;
  border-radius:12px;
  background:#eee;
  color:#111;
  font-weight:bold;
}

.btn:hover{
  background:white;
}

.btn.secondary{
  background:#242424;
  color:white;
  border:1px solid #444;
}

.btn.danger{
  background:#8d2222;
  color:white;
}

.hidden{
  display:none !important;
}

.section-title{
  font-size:13px;
  color:#999;
  letter-spacing:2px;
  margin-bottom:10px;
}

.code-box{
  text-align:center;
  font-size:42px;
  font-weight:bold;
  letter-spacing:8px;
  padding:18px;
  background:#080808;
  border:1px solid #444;
  border-radius:15px;
  margin:15px 0 25px;
}

.players{
  margin:15px 0;
}

.player{
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:#111;
  border:1px solid #333;
  padding:13px;
  border-radius:10px;
  margin:7px 0;
}

.player .you{
  color:#aaa;
  font-size:12px;
}

.case-title{
  font-size:29px;
  font-weight:bold;
  margin-bottom:18px;
  line-height:1.3;
}

.story{
  background:#111;
  border-left:4px solid #888;
  padding:18px;
  border-radius:10px;
  line-height:1.8;
  color:#ddd;
  margin-bottom:18px;
}

.evidence{
  background:#161616;
  border:1px solid #333;
  border-radius:12px;
  padding:15px;
  margin:10px 0;
  line-height:1.7;
}

.evidence b{
  display:block;
  margin-bottom:5px;
}

.secret{
  background:#17120d;
  border:1px solid #72582d;
  border-radius:14px;
  padding:20px;
  margin-top:20px;
  line-height:1.8;
}

.role{
  text-align:center;
  font-size:27px;
  font-weight:bold;
  margin-bottom:12px;
}

.timer{
  text-align:center;
  font-size:48px;
  font-weight:bold;
  margin:15px 0;
  letter-spacing:3px;
}

.vote-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:15px;
}

.vote-btn{
  padding:14px;
  background:#181818;
  color:white;
  border:1px solid #444;
  border-radius:10px;
}

.vote-btn:hover{
  background:#292929;
}

.result{
  text-align:center;
  padding:25px;
  background:#111;
  border-radius:15px;
  margin-top:20px;
}

.score{
  display:flex;
  justify-content:space-between;
  padding:12px;
  background:#151515;
  border-radius:9px;
  margin:6px 0;
}

.small{
  color:#888;
  font-size:13px;
  line-height:1.6;
}

.error{
  color:#ff7777;
  text-align:center;
  margin-top:10px;
}

.success{
  color:#7cff9b;
  text-align:center;
  margin-top:10px;
}

@media(max-width:500px){
  .card{
    padding:20px;
  }

  .logo{
    font-size:32px;
  }

  .code-box{
    font-size:32px;
  }

  .case-title{
    font-size:24px;
  }

  .timer{
    font-size:40px;
  }

  .vote-grid{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<!-- HOME -->
<div id="homeScreen" class="screen">
  <div class="card">

    <div class="logo">THE CASE</div>
    <div class="subtitle">A social detective game</div>

    <input id="homeName" placeholder="Enter your name">

    <button class="btn" onclick="createGame()">
      CREATE GAME
    </button>

    <button class="btn secondary" onclick="showJoin()">
      JOIN GAME
    </button>

    <div id="joinBox" class="hidden">

      <input id="joinName" placeholder="Enter your name">

      <input id="joinCode"
             placeholder="GAME CODE"
             maxlength="6"
             style="text-transform:uppercase">

      <button class="btn" onclick="joinGame()">
        JOIN
      </button>

    </div>

    <div id="homeMessage"></div>

  </div>
</div>


<!-- LOBBY -->
<div id="lobbyScreen" class="screen hidden">
  <div class="card">

    <div class="logo" style="font-size:32px">
      THE CASE
    </div>

    <div class="section-title">
      GAME CODE
    </div>

    <div id="gameCodeDisplay" class="code-box">
      ------
    </div>

    <div class="section-title">
      PLAYERS
    </div>

    <div id="playersList" class="players"></div>

    <button id="startBtn"
            class="btn hidden"
            onclick="startGame()">
      START CASE
    </button>

    <div id="lobbyMessage" class="small" style="text-align:center;margin-top:15px">
      Waiting for players...
    </div>

  </div>
</div>


<!-- GAME -->
<div id="gameScreen" class="screen hidden">
  <div class="card">

    <div class="section-title">
      THE CASE
    </div>

    <div id="caseTitle" class="case-title"></div>

    <div id="caseStory" class="story"></div>

    <div class="section-title">
      EVIDENCE
    </div>

    <div id="evidenceBox"></div>

    <div class="secret">

      <div class="section-title">
        PRIVATE INFORMATION
      </div>

      <div id="roleText" class="role"></div>

      <div id="secretText"></div>

    </div>

    <div id="timer" class="timer">
      15:00
    </div>

    <div id="voteArea"></div>

    <div id="resultArea"></div>

  </div>
</div>


<script>

/* =========================================================
   CASE DATABASE
========================================================= */

const cases = [

{
title:"لغز يخت البحر المظلم",

story:"على متن يخت فاخر في عرض البحر، انطفأت الكهرباء لمدة ثلاث دقائق بالضبط. بعد عودة التيار، اكتشف الجميع أن أحد النزلاء قُتل وأن مستندات مهمة اختفت من غرفة التخزين. الباب كان مغلقًا دون آثار اقتحام.",

evidence:[
"المفتاح الخاص بغرفة التخزين كان معلقًا في مكانه.",
"شخص واحد فقط قال إنه سمع خطوات سريعة أثناء الظلام.",
"ساعة الممر توقفت عند لحظة انقطاع الكهرباء.",
"وُجدت ورقة ممزقة بالقرب من غرفة التخزين."
],

clues:[
"قبل انقطاع الكهرباء بدقائق، رأيت شخصًا يتجه ناحية السلم المؤدي للطابق السفلي.",
"سمعت صوت مفتاح يسقط على الأرض أثناء الظلام، لكنك لم تعرف صاحبه.",
"كنت في صالة اليخت وقت انقطاع الكهرباء، وسمعت بابًا يُغلق في الأسفل.",
"لاحظت أن أحد الأشخاص كان يعرف مكان غرفة التخزين بشكل أفضل من الباقين."
],

solution:"المتهم استغل انقطاع الكهرباء للوصول إلى غرفة التخزين وإخفاء المستندات، ثم حاول جعل حركة المفتاح والباب تبدو كأنها حدثت دون تدخل منه."
},

{
title:"جريمة خيمة العرّافة المسحورة",

story:"في مخيم صحراوي، بدأت عاصفة قوية وأصبحت الرؤية شبه معدومة. بعد دقائق، اكتشف الموجودون أن العرّافة قُتلت داخل خيمتها وأن صندوقها الثمين اختفى.",

evidence:[
"الباب الأمامي للخيمة كان مغلقًا.",
"وُجدت آثار حركة بالقرب من الجزء الخلفي للخيمة.",
"رائحة عطر قوية بقيت داخل الخيمة.",
"أحد الموجودين اختفى عن حلقة النار لعدة دقائق."
],

clues:[
"رأيت شخصًا يبتعد عن الخيمة قبل العاصفة مباشرة.",
"سمعت حركة خلف الخيمة أثناء أسوأ لحظات العاصفة.",
"لاحظت أن أحد الأشخاص كان يعرف مكان صندوق العرّافة.",
"شخص ما سأل عن مكان العرّافة قبل بداية العاصفة."
],

solution:"المتهم استغل العاصفة للوصول إلى الخيمة وإخفاء الصندوق، ثم حاول استخدام وجود شخص آخر بعيدًا عن النار لصرف الشبهات."
},

{
title:"سرقة المتحف الأثرية الكبيرة",

story:"في منتصف الليل، اختفى تمثال أثري نادر من متحف مغلق. وُجد حارس الأمن فاقدًا للوعي، وكانت لوحة الكهرباء معطلة وكاميرات المراقبة توقفت في نفس الفترة.",

evidence:[
"الكاميرات توقفت قبل اختفاء التمثال مباشرة.",
"استُخدم مفتاح احتياطي لفتح منطقة التخزين.",
"وُجدت بقعة زيت بالقرب من لوحة الكهرباء.",
"لم تظهر آثار اقتحام على الباب الرئيسي."
],

clues:[
"كنت تعرف أن هناك مفتاحًا احتياطيًا للمخزن.",
"رأيت شخصًا بالقرب من لوحة الكهرباء قبل الحادث.",
"سمعت صوت قفل حديدي بعد توقف الكاميرات.",
"شخص ما كان مهتمًا جدًا بمواعيد تغيير الحراسة."
],

solution:"المتهم استخدم معرفة مسبقة بالمتحف والمفتاح الاحتياطي، وعطل المراقبة ثم نقل التمثال أثناء فترة الغياب."
},

{
title:"قطار منتصف الليل السريع",

story:"أثناء رحلة قطار سريع في الصحراء، عُثر على أحد الركاب مقتولًا داخل مقصورته. الباب كان مغلقًا، وانقطعت الكهرباء للحظات أثناء مرور القطار في منطقة مظلمة.",

evidence:[
"باب المقصورة كان مغلقًا عند اكتشاف الحادث.",
"شباك الطوارئ كان مفتوحًا قليلًا.",
"وُجدت علبة سجائر ليست ملكًا للضحية.",
"ثلاثة ركاب سمعوا خطوات في الممر."
],

clues:[
"رأيت شخصًا يمر بالممر وقت انقطاع الكهرباء.",
"كنت تعرف أن شباك الطوارئ يمكن فتحه.",
"وجدت علبة سجائر في مكان لم تكن فيه قبل الرحلة.",
"أحد الركاب غيّر مكانه بشكل مفاجئ بعد انقطاع الكهرباء."
],

solution:"المتهم استغل حركة القطار والظلام للخروج من المقصورة دون استخدام الممر بالطريقة المعتادة، ثم ترك دليلًا يمكن أن يوجه الشك إلى شخص آخر."
},

{
title:"مأساة كواليس المسرح المظلم",

story:"أثناء عرض مسرحي مزدحم، حدث خلل مفاجئ في الإضاءة. وبعد لحظات، اكتشف الفريق أن المخرج قُتل خلف الكواليس واختفت إيرادات التذاكر.",

evidence:[
"أداة من أدوات المسرح وُجدت في مكان غير مكانها.",
"لوحة الإضاءة حدث بها خلل قبل الحادث.",
"كان هناك خلاف قديم بين المخرج وأحد أفراد الفريق.",
"اختفت حقيبة تحتوي على الإيرادات."
],

clues:[
"كنت خلف الستارة قبل انطفاء الإضاءة.",
"سمعت شخصين يتجادلان قبل بداية العرض.",
"رأيت شخصًا يحمل حقيبة بالقرب من غرفة الإدارة.",
"لاحظت أن أحد الأدوات تم تبديل مكانها."
],

solution:"المتهم استغل الفوضى الناتجة عن خلل الإضاءة للوصول إلى المخرج وسرقة الإيرادات، ثم اعتمد على الخلافات القديمة لصرف الانتباه."
},

{
title:"جريمة الغرفة 404 في الفندق المهجور",

story:"في فندق قديم، اكتُشفت غرفة 404 في حالة فوضى بعد حادث غامض. وُجدت آثار طينية قرب النافذة، بينما كان بعض الموجودين متأكدين أن الغرفة لم يدخلها أحد من الممر.",

evidence:[
"آثار طينية ظهرت بالقرب من النافذة.",
"لم يوجد كسر واضح في الباب.",
"انقطعت الكهرباء في الفندق لفترة قصيرة.",
"اختفى مستند مهم من الغرفة."
],

clues:[
"رأيت شخصًا يحمل حذاءً عليه طين.",
"كنت بالقرب من الدرج وقت انقطاع الكهرباء.",
"سمعت حركة عند النافذة.",
"شخص ما كان يعرف قيمة المستند المختفي."
],

solution:"المتهم استخدم النافذة لصناعة قصة عن اقتحام خارجي، بينما كان هدفه الحقيقي الوصول إلى المستند."
},

{
title:"انفجار المعمل السري",

story:"حدث تسريب خطير داخل معمل علمي، وتوقفت أنظمة الحماية. بعد انتهاء الفوضى، اختفت تركيبة بحثية مهمة واكتُشف أن رئيس الفريق لم يعد موجودًا.",

evidence:[
"التسريب بدأ بالقرب من منطقة الأبحاث.",
"خزنة الأبحاث كانت مفتوحة.",
"مفتاح الخزنة كان مكسورًا.",
"أحد الباحثين تجاهل إنذارًا سابقًا."
],

clues:[
"سمعت إنذارًا قبل بداية الفوضى.",
"رأيت شخصًا يدخل منطقة الأبحاث قبل الحادث.",
"كنت تعرف مكان الخزنة.",
"لاحظت أن أحد الباحثين تصرف بهدوء غريب أثناء الإخلاء."
],

solution:"المتهم استغل الفوضى الناتجة عن التسريب للوصول إلى الأبحاث وإخفاء أثره."
},

{
title:"فنجان القهوة المر في المقهى المهجور",

story:"في مقهى قديم، تناول ناقد فني قهوته ثم ساءت حالته بشكل مفاجئ. بعد ذلك اكتُشفت سرقة محفظته واختفاء بعض أوراقه.",

evidence:[
"الفنجان لم يعد في مكانه الأصلي.",
"تم تنظيف جزء من الطاولة.",
"اختفت محفظة الضحية.",
"شخص واحد طلب تغيير مكان الجلوس قبل الحادث."
],

clues:[
"رأيت شخصًا يقترب من الطاولة.",
"لاحظت أن الفنجان تحرك من مكانه.",
"كنت جالسًا بالقرب من الضحية.",
"سمعت شخصًا يسأل عن المحفظة قبل الحادث."
],

solution:"المتهم استغل انشغال الموجودين وحركة الطاولات للوصول إلى فنجان الضحية وسرقة أوراقه."
},

{
title:"استوديو الرسام الغامض",

story:"داخل استوديو مغلق، اكتشف الأصدقاء أن الرسام مات وأن لوحته الأصلية اختفت. كانت أدوات الرسم مبعثرة، وبعضها وُجد في أماكن غير معتادة.",

evidence:[
"اللوحة الأصلية اختفت.",
"باب الاستوديو لم يكن مكسورًا.",
"أداة رسم وُجدت في غير مكانها.",
"كان هناك خلاف حول ملكية اللوحة."
],

clues:[
"سمعت خلافًا حول اللوحة قبل الحادث.",
"رأيت شخصًا يقترب من الاستوديو.",
"كنت تعرف قيمة اللوحة.",
"لاحظت أن أحد الأشخاص كان يبحث عن شيء داخل الاستوديو."
],

solution:"المتهم كان يعرف قيمة اللوحة والخلاف حول ملكيتها، واستغل الفوضى لإخفائها."
},

{
title:"لغز الجزيرة المقطوعة",

story:"بعد عاصفة قوية في جزيرة معزولة، اكتشف أفراد المجموعة أن أحد السياح مات وأن مؤنًا ثمينة اختفت. قارب النجاة تحرك بعيدًا عن الشاطئ.",

evidence:[
"قارب النجاة تحرك دون إعلان.",
"آثار أقدام ظهرت بالقرب من الشاطئ.",
"اختفت مؤن من المخزن.",
"العاصفة أخفت معظم الأصوات."
],

clues:[
"رأيت شخصًا بالقرب من القارب.",
"كنت تعرف مكان المؤن.",
"سمعت حركة على الشاطئ أثناء العاصفة.",
"شخص ما سأل عن موعد وصول المساعدة."
],

solution:"المتهم استغل العاصفة للتحرك بين المخزن والشاطئ وإخفاء هدفه الحقيقي."
},

{
title:"دموع ليلة الفرح الكبير",

story:"خلال حفل زفاف مزدحم، انقطعت الكهرباء فجأة. عند عودتها، اكتشف الحاضرون اختفاء محتويات خزنة وغياب حارس القاعة.",

evidence:[
"الخزنة كانت مفتوحة.",
"الكهرباء انقطعت لعدة دقائق.",
"حركة الناس كانت كثيفة.",
"أحد مفاتيح القاعة اختفى ثم ظهر."
],

clues:[
"رأيت شخصًا يتجه ناحية غرفة الخزنة.",
"كنت بالقرب من لوحة الكهرباء.",
"سمعت صوت باب يفتح أثناء الظلام.",
"شخص ما كان يعرف موعد الحفل بالتفصيل."
],

solution:"المتهم استغل الزحام والظلام للوصول إلى الخزنة ثم حاول الاعتماد على الفوضى لإخفاء تحركاته."
},

{
title:"مكتبة التاريخ القديمة",

story:"في مكتبة تاريخية، اختفت مخطوطة نادرة بعد حادث غامض لأمين المكتبة. نافذة المخزن كانت مكسورة، مما جعل الجميع يعتقد أن شخصًا من الخارج دخل المكان.",

evidence:[
"نافذة المخزن مكسورة.",
"المخطوطة اختفت من مكان محفوظ.",
"لم تختفِ أي كتب أخرى.",
"المتهم الحقيقي كان يعرف نظام المكتبة."
],

clues:[
"كنت تعرف مكان المخطوطة.",
"رأيت النافذة قبل أن تُكسر.",
"سمعت صوتًا داخل المخزن.",
"شخص ما كان يعرف موعد إغلاق المكتبة."

/* =========================================================
   GAME VARIABLES
========================================================= */

let peer = null;
let hostPeer = null;
let isHost = false;

let myName = "";
let myId = "";

let gameCode = "";
let players = [];

let connections = {};

let currentCase = null;
let myRole = "";
let mySecret = "";

let gameStarted = false;
let gameEndTime = 0;
let timerInterval = null;

let votes = {};
let voted = false;

let scores = {};


/* =========================================================
   HELPERS
========================================================= */

function $(id){
  return document.getElementById(id);
}

function generateCode(){

  const chars =
    "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

  let code="";

  for(let i=0;i<6;i++){
    code += chars[Math.floor(Math.random()*chars.length)];
  }

  return code;
}

function shuffle(array){

  return [...array].sort(
    ()=>Math.random()-0.5
  );

}

function showScreen(id){

  ["homeScreen","lobbyScreen","gameScreen"]
  .forEach(x=>{
    $(x).classList.add("hidden");
  });

  $(id).classList.remove("hidden");
}

function showJoin(){

  $("joinBox").classList.remove("hidden");

}

function message(text,type=""){

  $("homeMessage").className =
    type==="error" ? "error" :
    type==="success" ? "success" : "";

  $("homeMessage").innerText=text;

}


/* =========================================================
   CREATE GAME
========================================================= */

function createGame(){

  myName =
    $("homeName").value.trim();

  if(!myName){

    message("Enter your name first.","error");
    return;

  }

  isHost=true;

  gameCode=generateCode();

  myId="";

  peer = new Peer(
    "THECASE-"+gameCode
  );

  peer.on("open",id=>{

    myId=id;

    players=[
      {
        id:id,
        name:myName
      }
    ];

    scores[id]=0;

    $("gameCodeDisplay").innerText =
      gameCode;

    $("startBtn").classList.remove("hidden");

    showScreen("lobbyScreen");

    updatePlayers();

  });

  peer.on("connection",conn=>{

    connections[conn.peer]=conn;

    conn.on("open",()=>{});

    conn.on("data",data=>{

      handleHostData(conn,data);

    });

    conn.on("close",()=>{

      delete connections[conn.peer];

      players =
        players.filter(
          p=>p.id!==conn.peer
        );

      updatePlayers();
      broadcastPlayers();

    });

  });

  peer.on("error",err=>{

    message(
      "Could not create game. Try again.",
      "error"
    );

  });

}


/* =========================================================
   HOST DATA
========================================================= */

function handleHostData(conn,data){

  if(data.type==="JOIN"){

    const exists =
      players.some(
        p=>p.id===data.id
      );

    if(!exists){

      players.push({
        id:data.id,
        name:data.name
      });

      scores[data.id]=0;

    }

    broadcastPlayers();

  }

  if(data.type==="VOTE"){

    if(!gameStarted) return;

    if(votes[data.voter]) return;

    if(data.voter===data.target) return;

    votes[data.voter]=data.target;

    checkVotes();

  }

}


/* =========================================================
   BROADCAST
========================================================= */

function broadcastPlayers(){

  const packet={
    type:"PLAYERS",
    players:players
  };

  Object.values(connections)
  .forEach(conn=>{

    if(conn.open){
      conn.send(packet);
    }

  });

  updatePlayers();

}


/* =========================================================
   JOIN GAME
========================================================= */

function joinGame(){

  myName =
    $("joinName").value.trim();

  gameCode =
    $("joinCode").value.trim().toUpperCase();

  if(!myName){

    message("Enter your name first.","error");
    return;

  }

  if(gameCode.length!==6){

    message("Enter a valid 6-character code.","error");
    return;

  }

  isHost=false;

  peer = new Peer();

  peer.on("open",id=>{

    myId=id;

    hostPeer =
      "THECASE-"+gameCode;

    const conn =
      peer.connect(hostPeer);

    connections.host=conn;

    conn.on("open",()=>{

      conn.send({
        type:"JOIN",
        name:myName,
        id:myId
      });

      $("gameCodeDisplay").innerText =
        gameCode;

      showScreen("lobbyScreen");

      $("startBtn")
        .classList.add("hidden");

    });

    conn.on("data",data=>{

      handleClientData(data);

    });

    conn.on("close",()=>{

      alert("Host disconnected.");

      location.reload();

    });

  });

  peer.on("error",err=>{

    message(
      "Could not join this game. Check the code.",
      "error"
    );

  });

}


/* =========================================================
   CLIENT DATA
========================================================= */

function handleClientData(data){

  if(data.type==="PLAYERS"){

    players=data.players;

    updatePlayers();

  }

  if(data.type==="GAME_START"){

    receiveGame(data);

  }

  if(data.type==="TIMER"){

    gameEndTime=data.endTime;

  }

  if(data.type==="RESULT"){

    showResult(data);

  }

}


/* =========================================================
   UPDATE PLAYERS
========================================================= */

function updatePlayers(){

  $("playersList").innerHTML="";

  players.forEach(player=>{

    const div=
      document.createElement("div");

    div.className="player";

    div.innerHTML=
      `<span>${escapeHtml(player.name)}</span>
       <span class="you">
       ${player.id===myId ? "YOU" : ""}
       </span>`;

    $("playersList").appendChild(div);

  });

  if(isHost){

    if(players.length<3){

      $("lobbyMessage").innerText =
        "Need at least 3 players to start.";

      $("startBtn").disabled=true;

    }else{

      $("lobbyMessage").innerText =
        "Ready to start.";

      $("startBtn").disabled=false;

    }

  }

}


/* =========================================================
   START GAME
========================================================= */

function startGame(){

  if(!isHost) return;

  if(players.length<3){

    alert("You need at least 3 players.");
    return;

  }

  currentCase =
    cases[
      Math.floor(
        Math.random()*cases.length
      )
    ];

  const shuffled =
    shuffle(players);

  const detective =
    shuffled[0];

  const accused =
    shuffled[1];

  const suspects =
    shuffled.slice(2);

  const roles={};

  roles[detective.id]={
    role:"DETECTIVE",
    secret:
      "أنت المحقق. مهمتك جمع المعلومات وطرح الأسئلة وملاحظة التناقضات. لا تكشف معلوماتك الخاصة بسهولة."
  };

  roles[accused.id]={
    role:"ACCUSED",
    secret:
      "أنت المتهم الحقيقي في هذه القضية. حاول الدفاع عن نفسك دون كشف حقيقتك. باقي اللاعبين لا يعرفون هويتك."
  };

  suspects.forEach((player,index)=>{

    const clue =
      currentCase.clues[
        index % currentCase.clues.length
      ];

    roles[player.id]={
      role:"SUSPECT",
      secret:
        "معلومتك السرية: "+clue+
        "\n\nاستخدم هذه المعلومة أثناء التحقيق، لكن ليس من الضروري أن تكشف كل شيء فورًا."
    };

  });

  gameStarted=true;

  votes={};
  voted=false;

  const endTime =
    Date.now() + (15*60*1000);

  gameEndTime=endTime;

  players.forEach(player=>{

    const packet={

      type:"GAME_START",

      case:{
        title:currentCase.title,
        story:currentCase.story,
        evidence:currentCase.evidence
      },

      role:roles[player.id].role,

      secret:roles[player.id].secret,

      endTime:endTime

    };

    if(player.id===myId){

      receiveGame(packet);

    }else{

      const conn =
        connections[player.id];

      if(conn && conn.open){

        conn.send(packet);

      }

    }

  });

}


/* =========================================================
   RECEIVE GAME
========================================================= */

function receiveGame(data){

  currentCase=data.case;

  myRole=data.role;

  mySecret=data.secret;

  gameEndTime=data.endTime;

  gameStarted=true;

  voted=false;

  renderGame();

  startTimer();

  if(myRole==="ACCUSED"){

    $("voteArea").innerHTML=
      `<div class="small" style="text-align:center;margin-top:20px">
      أنت المتهم. لا يمكنك التصويت على نفسك.
      </div>`;

  }else{

    renderVoting();

  }

}


/* =========================================================
   RENDER GAME
========================================================= */

function renderGame(){

  $("caseTitle").innerText =
    currentCase.title;

  $("caseStory").innerText =
    currentCase.story;

  $("evidenceBox").innerHTML="";

  currentCase.evidence.forEach(
    (item,index)=>{

      const div=
        document.createElement("div");

      div.className="evidence";

      div.innerHTML=
        `<b>الدليل ${index+1}</b>
         ${escapeHtml(item)}`;

      $("evidenceBox")
        .appendChild(div);

    }
  );

  let roleName="";

  if(myRole==="DETECTIVE")
    roleName="🕵️ أنت المحقق";

  if(myRole==="ACCUSED")
    roleName="⚠️ أنت المتهم";

  if(myRole==="SUSPECT")
    roleName="👤 أنت مشتبه به";

  $("roleText").innerText =
    roleName;

  $("secretText").innerText =
    mySecret;

  $("resultArea").innerHTML="";

  showScreen("gameScreen");

}


/* =========================================================
   TIMER
========================================================= */

function startTimer(){

  clearInterval(timerInterval);

  function tick(){

    const remaining =
      Math.max(
        0,
        gameEndTime-Date.now()
      );

    const totalSeconds =
      Math.floor(remaining/1000);

    const minutes =
      Math.floor(totalSeconds/60);

    const seconds =
      totalSeconds%60;

    $("timer").innerText =
      String(minutes).padStart(2,"0")
      +":"+
      String(seconds).padStart(2,"0");

    if(remaining<=0){

      clearInterval(timerInterval);

      if(isHost){

        finishVoting();

      }

    }

  }

  tick();

  timerInterval =
    setInterval(tick,1000);

}


/* =========================================================
   VOTING
========================================================= */

function renderVoting(){

  $("voteArea").innerHTML=
    `<div class="section-title" style="margin-top:25px">
      VOTE
    </div>
    <div class="small">
      اختر الشخص الذي تعتقد أنه المتهم.
    </div>
    <div id="voteGrid" class="vote-grid"></div>`;

  const grid=
    $("voteGrid");

  players.forEach(player=>{

    if(player.id===myId) return;

    const btn=
      document.createElement("button");

    btn.className="vote-btn";

    btn.innerText=
      player.name;

    btn.onclick=()=>{

      submitVote(player.id);

    };

    grid.appendChild(btn);

  });

}


function submitVote(targetId){

  if(voted) return;

  if(myRole==="ACCUSED") return;

  voted=true;

  document
    .querySelectorAll(".vote-btn")
    .forEach(btn=>{
      btn.disabled=true;
    });

  if(isHost){

    votes[myId]=targetId;

    checkVotes();

  }else{

    const conn=
      connections.host;

    if(conn && conn.open){

      conn.send({

        type:"VOTE",

        voter:myId,

        target:targetId

      });

    }

  }

  $("voteArea").innerHTML=
    `<div class="success">
      تم تسجيل تصويتك.
    </div>`;

}


/* =========================================================
   CHECK VOTES
========================================================= */

function checkVotes(){

  const eligible =
    players.filter(
      p=>p.id!==getAccusedId()
    );

  const voteCount =
    Object.keys(votes).length;

  if(voteCount>=eligible.length){

    finishVoting();

  }

}


/* =========================================================
   FIND ACCUSED
========================================================= */

function getAccusedId(){

  for(const player of players){

    if(player._role==="ACCUSED"){
      return player.id;
    }

  }

  return null;

}


/* =========================================================
   FINISH VOTING
========================================================= */

function finishVoting(){

  if(!isHost) return;

  let accusedId=null;

  /*
    We keep the role hidden from players,
    but the host stores it here.
  */

  accusedId =
    window.__accusedId;

  if(!accusedId){

    finishWithoutRole();
    return;

  }

  const correctVoters=[];

  Object.keys(votes).forEach(voterId=>{

    if(votes[voterId]===accusedId){

      correctVoters.push(voterId);

    }

  });

  if(correctVoters.length===0){

    scores[accusedId] =
      (scores[accusedId]||0)+1;

  }else{

    correctVoters.forEach(id=>{

      scores[id]=
        (scores[id]||0)+1;

    });

  }

  const result={

    type:"RESULT",

    accusedId:accusedId,

    accusedName:
      players.find(
        p=>p.id===accusedId
      ).name,

    correctVoters:
      correctVoters,

    scores:scores

  };

  showResult(result);

  Object.values(connections)
  .forEach(conn=>{

    if(conn.open)
      conn.send(result);

  });

}


function finishWithoutRole(){

  alert("Game error. Please start a new game.");

}


/* =========================================================
   SHOW RESULT
========================================================= */

function showResult(data){

  clearInterval(timerInterval);

  let text="";

  if(data.correctVoters.length===0){

    text=
      "لم ينجح أحد في كشف المتهم!<br><br>"+
      "المتهم يحصل على نقطة.";

  }else{

    text=
      "تم كشف المتهم!<br><br>"+
      "كل لاعب اختار المتهم بشكل صحيح يحصل على نقطة.";

  }

  $("resultArea").innerHTML=

    `<div class="result">

      <h2>انتهت القضية</h2>

      <p style="margin:18px 0;line-height:1.8">
        المتهم الحقيقي هو:
        <br>
        <strong>${escapeHtml(data.accusedName)}</strong>
      </p>

      <p style="line-height:1.8">
        ${text}
      </p>

      <div style="margin-top:20px">
        <div class="section-title">
          SCORES
        </div>

        ${players.map(p=>`
          <div class="score">
            <span>${escapeHtml(p.name)}</span>
            <strong>${data.scores[p.id]||0}</strong>
          </div>
        `).join("")}

      </div>

      ${
        isHost
        ?
        `<button class="btn"
                 onclick="backToLobby()">
           BACK TO LOBBY
         </button>`
        :
        `<div class="small" style="margin-top:20px">
           Waiting for host...
         </div>`
      }

    </div>`;

}


/* =========================================================
   BACK TO LOBBY
========================================================= */

function backToLobby(){

  if(!isHost) return;

  gameStarted=false;

  votes={};

  currentCase=null;

  myRole="";

  mySecret="";

  $("resultArea").innerHTML="";

  $("startBtn")
    .classList.remove("hidden");

  showScreen("lobbyScreen");

  updatePlayers();

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(text){

  return String(text)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


/* =========================================================
   IMPORTANT HOST ROLE STORAGE
========================================================= */

/*
   We wrap startGame so the host secretly knows
   who the accused is.
*/

const originalStartGame = startGame;

startGame = function(){

  if(!isHost) return;

  if(players.length<3){

    alert("You need at least 3 players.");
    return;

  }

  currentCase =
    cases[
      Math.floor(
        Math.random()*cases.length
      )
    ];

  const shuffled =
    shuffle(players);

  const detective =
    shuffled[0];

  const accused =
    shuffled[1];

  window.__accusedId =
    accused.id;

  const suspects =
    shuffled.slice(2);

  const roles={};

  roles[detective.id]={
    role:"DETECTIVE",
    secret:
      "أنت المحقق. مهمتك جمع المعلومات وطرح الأسئلة وملاحظة التناقضات. لا تكشف معلوماتك الخاصة بسهولة."
  };

  roles[accused.id]={
    role:"ACCUSED",
    secret:
      "أنت المتهم الحقيقي في هذه القضية. حاول الدفاع عن نفسك دون كشف حقيقتك. باقي اللاعبين لا يعرفون هويتك."
  };

  suspects.forEach((player,index)=>{

    roles[player.id]={
      role:"SUSPECT",
      secret:
        "معلومتك السرية: "+
        currentCase.clues[
          index % currentCase.clues.length
        ]+
        "\n\nاستخدم هذه المعلومة أثناء التحقيق، لكن ليس من الضروري أن تكشف كل شيء فورًا."
    };

  });

  gameStarted=true;

  votes={};
  voted=false;

  const endTime=
    Date.now()+900000;

  gameEndTime=endTime;

  players.forEach(player=>{

    const packet={

      type:"GAME_START",

      case:{
        title:currentCase.title,
        story:currentCase.story,
        evidence:currentCase.evidence
      },

      role:roles[player.id].role,

      secret:roles[player.id].secret,

      endTime:endTime

    };

    if(player.id===myId){

      receiveGame(packet);

    }else{

      const conn=
        connections[player.id];

      if(conn && conn.open){

        conn.send(packet);

      }

    }

  });

};
